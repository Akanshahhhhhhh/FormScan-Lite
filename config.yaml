# FormScan-Lite shared config
# BOTH teammates use this file.
#   - Everything under `shared:` must stay identical on both machines.
#   - Each person fills in only their own script block.
# All paths are relative to the repo root (the folder containing this file).

shared:
  # Image preprocessing — identical for both scripts.
  img_height: 32
  img_width: 128
  channels: 1              # grayscale
  normalize_mean: 0.5
  normalize_std: 0.5

  # Unicode normalisation. MUST match between charset build, training
  # and inference, or conjuncts will map to different indices.
  unicode_norm: NFC

  # CTC settings
  blank_index: 0           # index 0 reserved for CTC blank

  # Training
  batch_size: 64
  epochs: 50
  lr: 0.0003
  seed: 42

  # Per-split exclusion lists live here: <exclude_dir>/<script>_<split>_exclude.txt
  # Generated by src/make_excludes.py. Commit these files.
  exclude_dir: "splits"

# Path rule: image = folder containing the annotation file / <path in the line>
scripts:
  bengali:
    charset_out: "models/charset_bengali.json"
    gt_train: "data/bengali/train/train.txt"
    gt_val:   "data/bengali/val/val_gt.txt"
    gt_test:  "data/bengali/test/test_gt.txt"

  kannada:
    # Person A: fill these in after running the same checks as Bengali.
    charset_out: "models/charset_kannada.json"
    gt_train: "data/kannada/train/CHANGE_ME.txt"
    gt_val:   "data/kannada/val/CHANGE_ME.txt"
    gt_test:  "data/kannada/test/CHANGE_ME.txt"
